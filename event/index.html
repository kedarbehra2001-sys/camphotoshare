<script>
(function () {
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get("eventId");
    const eventName = params.get("eventName") || "Your Event";

    const status = document.getElementById("status");
    const eventNameElement = document.getElementById("eventName");
    const openButton = document.getElementById("openAppButton");

    const playStoreUrl =
        "https://play.google.com/store/apps/details?id=com.camvibe.camphotoshare";

    if (!eventId) {
        eventNameElement.textContent = "Event not found";
        status.textContent = "Invalid event link. Please scan the correct QR code.";
        openButton.disabled = true;
        return;
    }

    eventNameElement.textContent = eventName;

    const query =
        "?eventId=" + encodeURIComponent(eventId) +
        "&eventName=" + encodeURIComponent(eventName);

    const appLink = "https://camphotoshare.in/event" + query;

    const intentLink =
        "intent://camphotoshare.in/event" + query +
        "#Intent;scheme=https;" +
        "package=com.camvibe.camphotoshare;" +
        "S.browser_fallback_url=" + encodeURIComponent(playStoreUrl) +
        ";end";

    function openOrInstall() {
        status.textContent = "Opening CamPhotoShare...";

        // Open installed app, otherwise use Play Store fallback.
        window.location.href = intentLink;
    }

    openButton.textContent = "Open / Install CamPhotoShare";
    openButton.addEventListener("click", openOrInstall);

    // Do not reload the same website URL.
    status.textContent = "Tap below to open or install CamPhotoShare.";
})();
</script>
