<script>
(function () {
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get("eventId");
    const eventName = params.get("eventName") || "Your Event";

    const status = document.getElementById("status");
    const eventNameElement = document.getElementById("eventName");
    const openButton = document.getElementById("openAppButton");

    const playStoreUrl =
        "https://play.google.com/store/apps/details?id=com.camvibe.camphotoshare";

    if (!eventId) {
        eventNameElement.textContent = "Event not found";
        status.textContent = "Invalid event link.";
        openButton.disabled = true;
        return;
    }

    eventNameElement.textContent = eventName;

    let appAttempted = false;
    let appOpened = false;

    function openApp() {
        appAttempted = true;
        status.textContent = "Opening CamPhotoShare...";

        // Verified Android App Link will open the installed app.
        window.location.href =
            "https://camphotoshare.in/event?eventId=" +
            encodeURIComponent(eventId) +
            "&eventName=" +
            encodeURIComponent(eventName);
    }

    openButton.addEventListener("click", function () {
        if (appOpened) return;

        if (openButton.dataset.mode === "install") {
            window.location.href = playStoreUrl;
        } else {
            openApp();
        }
    });

    document.addEventListener("visibilitychange", function () {
        if (document.hidden && appAttempted) {
            appOpened = true;
        }
    });

    openApp();

    setTimeout(function () {
        if (!appOpened) {
            status.textContent =
                "If CamPhotoShare is not opening, install it from Google Play.";

            openButton.textContent = "Install CamPhotoShare";
            openButton.dataset.mode = "install";
        }
    }, 2500);
})();
</script>
